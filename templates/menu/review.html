{% extends "core/core.html" %} {% load crispy_forms_tags %} {% load static %}
{%block content %}
<div class="review-section">
  <div class="review-container">
    <div class="form">
      <form method="post">
        {% csrf_token %}
        <h3>Review {{ item.name }}</h3>
        {{form|crispy}}
        <div class="submit">
          <input type="submit" value="Submit" />
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
